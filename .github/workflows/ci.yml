name: API CI

on:
  push:
    branches:
      - main
      - feature/crossword-generator-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newtimetolearn_test
      DB_SSL: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newtimetolearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newtimetolearn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        shell: bash
        run: |
          printf '%s\n' \
            'NODE_ENV=test' \
            'JWT_SECRET=ci-test-secret-that-is-longer-than-thirty-two-characters' \
            'DATABASE_URL=postgres://postgres:postgres@localhost:5432/newtimetolearn_test' \
            'DB_SSL=false' > .env.test

          for migration in src/shared/database/sql/*.sql; do
            echo "Applying $migration"
            PGPASSWORD=postgres psql \
              --host localhost \
              --username postgres \
              --dbname newtimetolearn_test \
              --set ON_ERROR_STOP=1 \
              --file "$migration"
          done

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
